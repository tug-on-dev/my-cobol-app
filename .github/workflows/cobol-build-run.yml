name: COBOL Build and Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    name: Compilation et Exécution du Programme COBOL
    runs-on: [self-hosted, cobol]
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3
        
      - name: Compilation du Programme COBOL
        run: |
          echo "Compilation du programme COBOL..."
          cobc -x -o hello_world hello_world.cbl
        
      - name: Exécution du Programme COBOL
        run: |
          echo "Exécution du programme COBOL..."
          ./hello_world

      - name: Écrire le résultat dans GitHub Summary
        run: |
          echo "## Résultat de l'exécution du programme COBOL" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ./hello_world >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
